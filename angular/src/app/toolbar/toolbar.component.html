<div class="container">
    <p [ngClass]="{'curr': path == '#/home'}" (click)="onClick('home')" tabindex="0" (keyup.enter)="onClick('home')">
        Home</p>
    <p [ngClass]="{'curr': path == '#/assessment-request'}" (click)="onClick('assessment-request')" tabindex="0"
        (keyup.enter)="onClick('assessment-request')">Schedule an Onsite Assessment</p>
    <p [ngClass]="{'curr': path == '#/services'}" (click)="onClick('services')" tabindex="0"
        (keyup.enter)="onClick('services')">Services</p>
    <p [ngClass]="{'curr': path == '#/why-choose-us'}" (click)="onClick('why-choose-us')" tabindex="0"
        (keyup.enter)="onClick('why-choose-us')">Why Choose Us</p>
    <p [ngClass]="{'curr': path == '#/community-involvement'}" (click)="onClick('community-involvement')" tabindex="0"
        (keyup.enter)="onClick('community-involvement')">Community Involvement</p>
</div>
